<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <style>
      .panel { fill: #fafafa; stroke: #bbb; stroke-width: 1; }
      .ptitle { font-size: 15px; font-weight: bold; fill: #111; }
      .box { fill: #fff; stroke: #222; stroke-width: 1.2; }
      .ext { fill: #fff; stroke: #777; stroke-width: 1.2; stroke-dasharray: 5 3; }
      .llm { fill: #fdeee3; stroke: #c4622d; stroke-width: 1.4; }
      .key { fill: #eef2f7; stroke: #222; stroke-width: 1.2; }
      .t { font-size: 14px; fill: #111; text-anchor: middle; }
      .tb { font-size: 14px; fill: #111; text-anchor: middle; font-weight: bold; }
      .s { font-size: 11.5px; fill: #444; text-anchor: middle; }
      .si { font-size: 11.5px; fill: #444; text-anchor: middle; }
      .lbl { font-size: 11px; fill: #333; }
      .ln { stroke: #222; stroke-width: 1.2; fill: none; marker-end: url(#ah); }
      .lng { stroke: #777; stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; marker-end: url(#ahg); }
    </style>
  </defs>

  <rect width="1200" height="590" fill="#fff"/>

  <!-- ===================== (a) Inputs ===================== -->
  <rect class="panel" x="15" y="15" width="225" height="530" rx="6"/>
  <text class="ptitle" x="30" y="40">(a) 입력</text>

  <rect class="box" x="30" y="95" width="195" height="74" rx="4"/>
  <text class="tb" x="127.5" y="120">명령</text>
  <text class="si" x="127.5" y="140">“A방에서 C방으로 가줘”</text>
  <text class="si" x="127.5" y="157">“A에서 C로 가”</text>

  <rect class="ext" x="30" y="345" width="195" height="100" rx="4"/>
  <text class="tb" x="127.5" y="372">3D 동적</text>
  <text class="tb" x="127.5" y="390">장면 그래프(3DDSG)</text>
  <text class="s" x="127.5" y="410">IFC 공간 · 문 · 복셀</text>
  <text class="s" x="127.5" y="427">(Neo4j, 이 저장소 밖에서 만듦)</text>

  <!-- ===================== (b) Goal parsing ===================== -->
  <rect class="panel" x="265" y="15" width="300" height="250" rx="6"/>
  <text class="ptitle" x="280" y="40">(b) 목표 해석</text>

  <rect class="box" x="285" y="55" width="200" height="50" rx="4"/>
  <text class="t" x="385" y="76">규칙 해석기</text>
  <text class="s" x="385" y="94">에서/으로 · → · from/to</text>

  <rect class="llm" x="285" y="130" width="200" height="50" rx="4"/>
  <text class="t" x="385" y="151">LLM 보조</text>
  <text class="s" x="385" y="169">방 번호만 고름 (DeepSeek)</text>

  <rect class="box" x="285" y="205" width="200" height="46" rx="4"/>
  <text class="t" x="385" y="225">방 번호 확인 (∈ G)</text>
  <text class="s" x="385" y="241">존재함 · 출발 ≠ 도착</text>

  <path class="ln" d="M385,105 L385,128"/>
  <text class="lbl" x="392" y="121">실패 / 불확실</text>
  <path class="ln" d="M385,180 L385,203"/>
  <!-- explicit rule result bypasses the LLM -->
  <path class="ln" d="M485,80 L520,80 L520,228 L487,228"/>
  <text class="lbl" x="535" y="150" transform="rotate(90 535 150)" text-anchor="middle">명확함</text>

  <!-- ===================== (c) Scene representation ===================== -->
  <rect class="panel" x="265" y="285" width="300" height="260" rx="6"/>
  <text class="ptitle" x="280" y="310">(c) 장면 표현</text>

  <rect class="box" x="285" y="325" width="260" height="50" rx="4"/>
  <text class="t" x="415" y="346">그래프 읽기 (GraphSource)</text>
  <text class="s" x="415" y="364">가짜 · 교환 폴더 · Neo4j (미완성)</text>

  <rect class="key" x="285" y="400" width="260" height="58" rx="4"/>
  <text class="tb" x="415" y="422">SceneGraph  G = (R, D, V)</text>
  <text class="s" x="415" y="441">방 R · 문 D · 복셀 V ∈ {빈, 점유, 미관측}</text>

  <rect class="box" x="285" y="483" width="260" height="46" rx="4"/>
  <text class="t" x="415" y="503">그래프 검사</text>
  <text class="s" x="415" y="519">연결성 · 여유를 둬도 문 통과 가능</text>

  <path class="ln" d="M415,375 L415,398"/>
  <path class="ln" d="M415,458 L415,481"/>

  <!-- ===================== (d) Route planning ===================== -->
  <rect class="panel" x="590" y="15" width="300" height="530" rx="6"/>
  <text class="ptitle" x="605" y="40">(d) 경로 계획</text>

  <rect class="box" x="610" y="60" width="260" height="56" rx="4"/>
  <text class="t" x="740" y="82">전역 계획 (방 순서)</text>
  <text class="s" x="740" y="101">방 그래프에서 최단 방 순서</text>

  <rect class="box" x="610" y="146" width="260" height="56" rx="4"/>
  <text class="t" x="740" y="168">핵심 지점</text>
  <text class="s" x="740" y="187">출발 방 → 문 중심 → 도착 방</text>

  <rect class="box" x="610" y="232" width="260" height="56" rx="4"/>
  <text class="t" x="740" y="254">장애물 부풀리기</text>
  <text class="s" x="740" y="273">25 cm 여유 · 미관측 복셀 규칙</text>

  <rect class="box" x="610" y="318" width="260" height="70" rx="4"/>
  <text class="t" x="740" y="340">지역 계획 (A*)</text>
  <text class="s" x="740" y="359">26방향 복셀 이동, 모서리 가로지르기 금지</text>
  <text class="s" x="740" y="376">+ 직선 시야가 되면 경로 단축</text>

  <rect class="key" x="610" y="418" width="260" height="56" rx="4"/>
  <text class="tb" x="740" y="440">경유점  W</text>
  <text class="s" x="740" y="459">G 기준 충돌 검사</text>

  <path class="ln" d="M740,116 L740,144"/>
  <path class="ln" d="M740,202 L740,230"/>
  <path class="ln" d="M740,288 L740,316"/>
  <path class="ln" d="M740,388 L740,416"/>

  <!-- ===================== (e) Execution ===================== -->
  <rect class="panel" x="915" y="15" width="270" height="530" rx="6"/>
  <text class="ptitle" x="930" y="40">(e) 실행</text>

  <rect class="box" x="930" y="60" width="240" height="56" rx="4"/>
  <text class="t" x="1050" y="82">비행 전 점검</text>
  <text class="s" x="1050" y="101">배터리 · 시뮬레이션 예행(실기체)</text>

  <rect class="box" x="930" y="146" width="240" height="56" rx="4"/>
  <text class="t" x="1050" y="168">실행기</text>
  <text class="s" x="1050" y="187">follow_path · 속도 ≤ 0.3 m/s</text>

  <rect class="box" x="930" y="232" width="240" height="40" rx="4"/>
  <text class="t" x="1050" y="257">DroneBackend</text>
  <rect class="box" x="930" y="290" width="114" height="52" rx="4"/>
  <text class="t" x="987" y="311">Crazyflie 2.1</text>
  <text class="s" x="987" y="329">+ Flow deck</text>
  <rect class="box" x="1056" y="290" width="114" height="52" rx="4"/>
  <text class="t" x="1113" y="311">MuJoCo</text>
  <text class="s" x="1113" y="329">시뮬레이션</text>

  <rect class="box" x="930" y="372" width="240" height="56" rx="4"/>
  <text class="t" x="1050" y="394">비행 감시</text>
  <text class="s" x="1050" y="413">계획에서 0.5 m 이상 벗어나면 중단 · 착륙</text>

  <rect class="box" x="930" y="458" width="240" height="56" rx="4"/>
  <text class="t" x="1050" y="480">계획과 비교</text>
  <text class="s" x="1050" y="499">계획 경로 vs 실제 비행 경로</text>

  <path class="ln" d="M1050,116 L1050,144"/>
  <path class="ln" d="M1050,202 L1050,230"/>
  <path class="ln" d="M987,272 L987,288"/>
  <path class="ln" d="M1113,272 L1113,288"/>
  <path d="M987,342 L987,356 L1113,356 L1113,342" stroke="#222" stroke-width="1.2" fill="none"/>
  <path class="ln" d="M1050,356 L1050,370"/>
  <path class="ln" d="M1050,428 L1050,456"/>
  <!-- per-waypoint feedback -->
  <path class="lng" d="M1170,400 L1178,400 L1178,174 L1172,174"/>

  <!-- ===================== cross-panel flows ===================== -->
  <!-- command -> rule parser -->
  <path class="ln" d="M225,132 L255,132 L255,80 L283,80"/>
  <!-- 3DDSG -> GraphSource -->
  <path class="ln" d="M225,395 L255,395 L255,350 L283,350"/>
  <!-- room list to LLM / verify (G feeds goal parsing) -->
  <path class="lng" d="M285,429 L272,429 L272,155 L283,155"/>
  <text class="lbl" x="263" y="226" transform="rotate(-90 263 226)" text-anchor="middle" fill="#666">방 목록</text>
  <!-- goal -> global planner -->
  <path class="ln" d="M485,240 L575,240 L575,88 L608,88"/>
  <text class="lbl" x="497" y="258">(출발, 도착)</text>
  <!-- G -> planning -->
  <path class="ln" d="M545,429 L580,429 L580,260 L608,260"/>
  <text class="lbl" x="550" y="446">G</text>
  <!-- waypoints -> execution -->
  <path class="ln" d="M870,446 L900,446 L900,88 L928,88"/>
  <text class="lbl" x="878" y="464">W</text>

  <!-- legend -->
  <g transform="translate(15,560)">
    <rect class="box" x="0" y="0" width="16" height="11" rx="2"/>
    <text class="lbl" x="22" y="10">모듈</text>
    <rect class="key" x="80" y="0" width="16" height="11" rx="2"/>
    <text class="lbl" x="102" y="10">핵심 데이터</text>
    <rect class="llm" x="190" y="0" width="16" height="11" rx="2"/>
    <text class="lbl" x="212" y="10">LLM (선택)</text>
    <rect class="ext" x="300" y="0" width="16" height="11" rx="2"/>
    <text class="lbl" x="322" y="10">외부</text>
    <path class="lng" d="M370,6 L400,6"/>
    <text class="lbl" x="408" y="10">보조 / 피드백</text>
  </g>
</svg>

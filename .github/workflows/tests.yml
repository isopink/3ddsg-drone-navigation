name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # open3d needs these system libraries on a headless runner
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgomp1
      - run: pip install -e ".[sim,viz,dev]"
      - run: pytest
